{% extends "base.html" %}
{% block title %}Log in | CommunityPulse{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">COMMUNITYPULSE ACCOUNT</span>
  <h1>Welcome back</h1>
  <p>Log in to continue to the private community tracker.</p>
  <form method="post" action="{{ url_for('login') }}" class="auth-form">
    <label>Email address
      <input type="email" name="email" required maxlength="254" autocomplete="email" value="{{ request.form.get('email', '') }}">
    </label>
    <label>Password
      <input type="password" name="password" required maxlength="128" autocomplete="current-password">
    </label>
    <button class="button button-green" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
